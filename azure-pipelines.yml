trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.12'
  displayName: 'Utiliser Python 3.12'

- script: |
    python -m pip install --upgrade pip
    if [ -f requirements.txt ]; then
      grep -v -i -E "pywin32|pypiwin32|pywinpty" requirements.txt > req_linux.txt
      pip install -r req_linux.txt || echo "Certaines dépendances n'ont pas pu être installées"
    fi
  displayName: 'Installer les dépendances'

- script: |
    python -m compileall .
  displayName: 'Vérifier la syntaxe du code'

- script: |
    ls -R
  displayName: 'Afficher les fichiers du projet'

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(Build.SourcesDirectory)'
    artifact: 'code-source'
  displayName: 'Publier le code'